<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            const browserLangs = navigator.languages || [navigator.language];
            let targetLang = 'en';
            
            for (const lang of browserLangs) {
                const l = lang.toLowerCase();
                if (l.startsWith('ru') || l.startsWith('uk') || l.startsWith('be') || l.startsWith('kk')) {
                    targetLang = 'ru';
                    break;
                }
            }
            window.location.replace(targetLang + '/index.html');
        })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="en/">English</a> or <a href="ru/">Russian</a> version...</p>
</body>
</html>
